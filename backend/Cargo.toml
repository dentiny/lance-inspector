[package]
name = "lance-inspector-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "58.4.0"
arrow-json = "58.4.0"
arrow-schema = "58.4.0"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
datafusion-execution = "54.1.0"
foyer = "0.22.3"
futures = "0.3.33"
lance = "9.0.1"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

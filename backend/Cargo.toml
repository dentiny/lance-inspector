[package]
name = "lance-inspector-backend"
version = "0.1.0"
edition = "2024"

[features]
default = ["profiling"]
profiling = [
    "dep:jemalloc_pprof",
    "dep:pprof",
    "tikv-jemallocator/profiling",
    "tikv-jemallocator/unprefixed_malloc_on_supported_platforms",
]

[dependencies]
anyhow = "1.0.104"
arrow-array = "58.4.0"
arrow-json = "58.4.0"
arrow-schema = "58.4.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
datafusion-execution = { version = "54.1.0", default-features = false }
futures = { version = "0.3.33", default-features = false, features = ["async-await", "std"] }
lance = { git = "https://github.com/lance-format/lance.git", rev = "17307f28d149eff34a0ecc5eca0e6ca903981620", default-features = false, features = ["aws", "gcp"] }
lru = "0.18.2"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
# Keep this aligned with reqwest's transitive version to avoid compiling two tower-http releases.
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15.0", features = ["flamegraph"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
jemalloc_pprof = { version = "0.9.0", features = ["flamegraph"], optional = true }

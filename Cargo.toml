[workspace]
members = ["backend"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-json = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
datafusion = { version = "54.1.0", default-features = false, features = ["sql"] }
datafusion-expr = { version = "54.1.0", default-features = false }
datafusion-sql = { version = "54.1.0", default-features = false }
file-format = { version = "0.29.0", features = ["reader-ebml", "reader-id3v2", "reader-mp4"] }
futures = { version = "0.3.33", default-features = false, features = ["std"] }
jemalloc_pprof = { version = "0.9.0", features = ["flamegraph"] }
lance = { git = "https://github.com/lance-format/lance.git", rev = "17307f28d149eff34a0ecc5eca0e6ca903981620", default-features = false, features = ["aws", "gcp"] }
lance-core = { git = "https://github.com/lance-format/lance.git", rev = "17307f28d149eff34a0ecc5eca0e6ca903981620", default-features = false }
lance-file = { git = "https://github.com/lance-format/lance.git", rev = "17307f28d149eff34a0ecc5eca0e6ca903981620", default-features = false }
lance-namespace = { git = "https://github.com/lance-format/lance.git", rev = "17307f28d149eff34a0ecc5eca0e6ca903981620", default-features = false }
lance-namespace-datafusion = { git = "https://github.com/lance-format/lance.git", rev = "17307f28d149eff34a0ecc5eca0e6ca903981620", default-features = false }
lru = "0.18.2"
pprof = { version = "0.15.0", features = ["flamegraph"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tempfile = "3.27"
thiserror = "2.0.20"
tikv-jemallocator = { version = "0.7.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lance-inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lance-inspector
  template:
    metadata:
      labels:
        app: lance-inspector
    spec:
      containers:
        - name: inspector
          image: ghcr.io/your-org/lance-inspector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: dataset
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Replace this hostPath with a PVC, CSI object-store mount, or remove it
        # when LANCE_DATASET_URI points directly at S3.
        - name: dataset
          hostPath:
            path: /tmp
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lance-inspector
spec:
  selector:
    app: lance-inspector
  ports:
    - name: http
      port: 80
      targetPort: http
